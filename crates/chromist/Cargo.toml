[package]
name = "chromist"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust browser automation via the Chrome DevTools Protocol"
keywords = ["browser", "automation", "cdp", "chrome", "devtools"]
categories = ["web-programming", "development-tools::testing", "asynchronous"]
readme = "../../README.md"

[features]
integration-tests = []
# Internal feature used by benches in benches/ to access `pub(crate)` types.
# Do not enable from library consumers — the surface is unstable.
_bench = []

[dependencies]
chromist-types.workspace = true
chromist-cdp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
async-tungstenite.workspace = true
futures.workspace = true
thiserror.workspace = true
fnv.workspace = true
base64.workspace = true
url.workspace = true
tokio = { workspace = true }
tracing.workspace = true
reqwest = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "event_fanout"
harness = false
required-features = ["_bench"]

[[bench]]
name = "dispatch"
harness = false
required-features = ["_bench"]

[[bench]]
name = "event_stream"
harness = false
