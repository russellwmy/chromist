[workspace]
members = [
    "crates/chromist-types",
    "crates/chromist-pdl",
    "crates/chromist-cdp",
    "crates/chromist",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Russell Wong"]
edition = "2021"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/russellwmy/chromist"
homepage = "https://github.com/russellwmy/chromist"

[workspace.dependencies]
# Internal crates
chromist-types = { path = "crates/chromist-types", version = "0.1.0" }
chromist-pdl = { path = "crates/chromist-pdl", version = "0.1.0" }
chromist-cdp = { path = "crates/chromist-cdp", version = "0.1.0" }
chromist = { path = "crates/chromist", version = "0.1.0" }

# Serde / JSON / encoding
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
base64 = "0.22.1"

# PDL codegen
proc-macro2 = "1.0.106"
quote = "1.0.45"
heck = "0.5.0"
indexmap = "2.14.0"

# Errors
thiserror = "2.0.18"

# Async / transport
async-tungstenite = { version = "0.34.0", default-features = false, features = ["handshake", "futures-03-sink", "tokio-rustls-webpki-roots"] }
futures = "0.3.32"
tokio = { version = "1.52.1", features = ["rt", "rt-multi-thread", "time", "fs", "macros", "process"] }

# Misc
fnv = "1.0.7"
url = "2.5.8"
tracing = "0.1.44"
libc = "0.2.186"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }

# Dev
criterion = { version = "0.8.2", default-features = false, features = ["plotters", "cargo_bench_support"] }
proptest = "1.5.0"
